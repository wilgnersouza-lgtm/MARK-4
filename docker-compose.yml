services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      # Em produção, defina JWT_SECRET no ambiente. Sem ele o backend não sobe.
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no seu .env ou no ambiente}
      - JWT_EXPIRY=24h
      - CORS_ORIGIN=http://localhost:3000
      - DATA_DIR=/app/data
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
